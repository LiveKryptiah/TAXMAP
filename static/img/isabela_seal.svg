  <circle cx="60" cy="60" r="54" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
  <circle cx="60" cy="60" r="44" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="2 3" />
  
  <!-- Cadastral Crosshairs -->
  <line x1="60" y1="6" x2="60" y2="18" stroke="#ffffff" stroke-width="1.2" />
  <line x1="60" y1="102" x2="60" y2="114" stroke="#ffffff" stroke-width="1.2" />
